<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>圆形智能手表 · 视频预览</title>
<style>
  :root {
    --bg: #101014;
    --panel: #1a1a20;
    --panel-2: #202027;
    --border: #2c2c34;
    --text: #e8e8ee;
    --text-dim: #9a9aa6;
    --accent: #4f7cff;
    --accent-soft: rgba(79, 124, 255, 0.15);
    --watch-bezel: #1b1b20;
    --watch-metal: linear-gradient(145deg, #3a3a42, #1c1c22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }

  .app {
    display: flex;
    height: 100vh;
    width: 100vw;
  }

  /* ===== 左侧列表 ===== */
  .sidebar {
    width: 300px;
    min-width: 300px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  .sidebar-header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .sidebar-header .count {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .video-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .video-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }
  .video-item:hover { background: var(--panel-2); }
  .video-item.active {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .video-item .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }
  .video-item.active .dot { background: var(--accent); }
  .video-item .name {
    font-size: 13px;
    line-height: 1.35;
    word-break: break-all;
    flex: 1;
  }

  .category-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 6px;
  }
  .category-title {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    padding: 10px 12px 4px;
    font-weight: 600;
  }
  .category-group:first-child .category-title {
    padding-top: 2px;
  }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  /* ===== 右侧预览区 ===== */
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background:
      radial-gradient(circle at 50% 40%, #232329 0%, #141418 70%);
  }

  /* 圆形手表外壳 */
  .watch {
    position: relative;
    width: 932px;
    height: 932px;
    border-radius: 50%;
    background: var(--watch-metal);
    box-shadow:
      0 40px 80px rgba(0,0,0,0.6),
      0 0 0 12px var(--watch-bezel),
      0 0 0 14px #0a0a0c,
      inset 0 0 60px rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* 屏幕（圆形的视频显示区） */
  .watch-screen {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #000;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .watch-screen video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* 屏幕高光 */
  .watch-screen::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 40%);
  }

  /* 空状态 */
  .empty {
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 2;
  }
  .empty .big { font-size: 40px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>演示视频列表</h1>
      <div class="count" id="count">加载中…</div>
    </div>
    <div class="video-list" id="videoList"></div>
    <div class="sidebar-footer">
      安克 X WorkBuddy 演示视频<br />点击左侧列表切换预览。
    </div>
  </aside>

  <main class="stage">
    <div class="watch">
      <div class="watch-screen" id="screen"></div>
    </div>
  </main>
</div>

<script>
  const listEl = document.getElementById('videoList');
  const screenEl = document.getElementById('screen');
  const countEl = document.getElementById('count');
  let videos = [];
  let currentVideoEl = null;

  async function load() {
    const res = await fetch('videos.json');
    videos = await res.json();
    renderList();
  }

  function renderList() {
    countEl.textContent = videos.length ? `共 ${videos.length} 个视频` : '暂无视频';
    listEl.innerHTML = '';

    if (!videos.length) {
      screenEl.innerHTML = `
        <div class="empty">
          <div class="big">⌚</div>
          <div>暂无视频</div>
        </div>`;
      currentVideoEl = null;
      return;
    }

    // 按分类分组渲染
    const groups = new Map();
    videos.forEach((v, i) => {
      const cat = v.category || '其他';
      if (!groups.has(cat)) groups.set(cat, []);
      groups.get(cat).push({ v, i });
    });

    groups.forEach((items, cat) => {
      const groupEl = document.createElement('div');
      groupEl.className = 'category-group';
      const titleEl = document.createElement('div');
      titleEl.className = 'category-title';
      titleEl.textContent = cat;
      groupEl.appendChild(titleEl);
      items.forEach(({ v, i }) => {
        const item = document.createElement('div');
        item.className = 'video-item';
        item.innerHTML = `<span class="dot"></span><span class="name"></span>`;
        item.querySelector('.name').textContent = v.name;
        item.addEventListener('click', () => {
          document.querySelectorAll('.video-item').forEach((el) => el.classList.remove('active'));
          item.classList.add('active');
          play(i);
        });
        groupEl.appendChild(item);
      });
      listEl.appendChild(groupEl);
    });

    // 默认选中第一个
    const firstItem = listEl.querySelector('.video-item');
    if (firstItem) firstItem.classList.add('active');
    play(0);
  }

  function play(i) {
    const v = videos[i];
    if (!v) return;
    if (currentVideoEl) {
      currentVideoEl.pause();
      currentVideoEl.remove();
      currentVideoEl = null;
    }
    const video = document.createElement('video');
    video.src = v.file;
    video.autoplay = true;
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    video.controls = false;
    video.addEventListener('click', () => {
      video.muted = !video.muted;
    });
    screenEl.innerHTML = '';
    screenEl.appendChild(video);
    currentVideoEl = video;
    video.play().catch(() => {});
  }

  // 键盘上下左右切换
  document.addEventListener('keydown', (e) => {
    const items = Array.from(document.querySelectorAll('.video-item'));
    if (!items.length) return;
    const idx = items.findIndex((el) => el.classList.contains('active'));
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
      items[(idx + 1) % items.length].click();
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
      items[(idx - 1 + items.length) % items.length].click();
    }
  });

  load();
</script>
</body>
</html>
